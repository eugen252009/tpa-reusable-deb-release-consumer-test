name: Disposable cross-repository TPA release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: eugen252009/tpa-reusable-deb-release-builder-test/.github/workflows/reusable-deb-release.yml@8d5811a5bd1af55cff15ba17e941caa98223aa31
    with:
      config: .tpa-release.yml
      tpa-repository: eugen252009/tpa-reusable-deb-release-builder-test
      tpa-ref: 8d5811a5bd1af55cff15ba17e941caa98223aa31
      tpa-version: "0.7.0"
