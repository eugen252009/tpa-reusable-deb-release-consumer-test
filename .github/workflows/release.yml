name: Disposable cross-repository TPA release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: eugen252009/tpa-reusable-deb-release-builder-test/.github/workflows/reusable-deb-release.yml@da10258bdddb54d5ecf1071cc3d585d9bc378be7
    with:
      config: .tpa-release.yml
      tpa-repository: eugen252009/tpa-reusable-deb-release-builder-test
      tpa-ref: da10258bdddb54d5ecf1071cc3d585d9bc378be7
      tpa-version: "0.7.0"
